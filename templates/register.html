<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MerchantTrade</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0a0a0f, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            padding: 80px 20px 20px;
        }
        .form-container {
            width: 90%;
            max-width: 450px;
        }
        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .form-header h2 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .form-header p {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }
        .bottom-link {
            text-align: center;
            margin-top: 25px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }
        .bottom-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .bottom-link a:hover { text-decoration: underline; }
        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="logo">🤝</div>
        <div class="form-header">
            <h2>Join MerchantTrade!</h2>
            <p>Create your free merchant account</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>👤 Your Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>🏪 Shop Name</label>
                <input type="text" name="shop_name" placeholder="Enter your shop name" required>
            </div>
            <div class="form-group">
                <label>📱 Phone Number</label>
                <input type="text" name="phone" placeholder="Enter your phone number" required>
            </div>
            <div class="form-group">
                <label>📍 Location</label>
                <input type="text" name="location" placeholder="Enter your shop location" required>
            </div>
            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
            </div>
            <button type="submit" class="submit-btn">Register Now 🎉</button>
        </form>

        <div class="bottom-link">
            Already registered? <a href="/login">Login here</a>
        </div>
    </div>
</body>
</html>
