<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MerchantTrade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background: #c0392b; }
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .login-link a { color: #3498db; text-decoration: none; }
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: #2c3e50;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 { color: white; font-size: 22px; }
        .navbar a { color: white; text-decoration: none; margin-left: 20px; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>🤝 MerchantTrade</h1>
        <div>
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>
    </div>

    <div class="container">
        <h2>🏪 Register Your Shop</h2>

        <form method="POST">
            <div class="form-group">
                <label>👤 Your Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>🏪 Shop Name</label>
                <input type="text" name="shop_name" placeholder="Enter your shop name" required>
            </div>

            <div class="form-group">
                <label>📱 Phone Number</label>
                <input type="text" name="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label>📍 Location</label>
                <input type="text" name="location" placeholder="Enter your shop location" required>
            </div>

            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn">Register Now 🎉</button>
        </form>

        <div class="login-link">
            Already registered? <a href="/login">Login here</a>
        </div>
    </div>

</body>
</html>
