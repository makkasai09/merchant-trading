<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Stock - MerchantTrade</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0a0a0f, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            padding: 80px 20px 20px;
        }
        .form-container {
            width: 90%;
            max-width: 500px;
        }
        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .form-header h2 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .form-header p {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }
        .bottom-link {
            text-align: center;
            margin-top: 25px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }
        .bottom-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>🤝 MerchantTrade</h1>
        <div>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <div class="form-container">
        <div class="logo">📦</div>
        <div class="form-header">
            <h2>Post Your Stock!</h2>
            <p>List your excess inventory for nearby merchants</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>📦 Stock Title</label>
                <input type="text" name="title"
                       placeholder="e.g. Notebooks, Rice Bags, Pens" required>
            </div>
            <div class="form-group">
                <label>📝 Description</label>
                <textarea name="description"
                          placeholder="Describe your stock — condition, brand, etc."
                          required></textarea>
            </div>
            <div class="form-group">
                <label>🔢 Quantity</label>
                <input type="text" name="quantity"
                       placeholder="e.g. 200 pieces, 50 kg" required>
            </div>
            <div class="form-group">
                <label>💰 Price (₹)</label>
                <input type="number" name="price"
                       placeholder="Enter price in rupees" required>
            </div>
            <div class="form-group">
                <label>🏷️ Category</label>
                <select name="category" required>
                    <option value="">Select category</option>
                    <option value="Stationery">📚 Stationery</option>
                    <option value="Grocery">🛒 Grocery</option>
                    <option value="Electronics">⚡ Electronics</option>
                    <option value="Clothing">👗 Clothing</option>
                    <option value="Food">🍎 Food</option>
                    <option value="Medicine">💊 Medicine</option>
                    <option value="Hardware">🔧 Hardware</option>
                    <option value="Other">📦 Other</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Post Stock 🚀</button>
        </form>

        <div class="bottom-link">
            <a href="/dashboard">← Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
